spring.application.name=courslens-test
spring.datasource.url=jdbc:h2:mem:courslens-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
courselens.storage.upload-dir=./data/uploads-test
courselens.chunk.size=650
courselens.chunk.overlap=90
gemini.embedding-model=gemini-embedding-2
gemini.embedding-dimension=768
spring.flyway.enabled=false
gemini.api-key=
gemini.model=gemini-3.6-flash
courselens.retrieval.max-cosine-distance=0.65
