spring.application.name=courslens
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:courslens;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
courselens.storage.upload-dir=${COURSELENS_STORAGE_DIR:./data/uploads}
courselens.chunk.size=${COURSELENS_CHUNK_SIZE:650}
courselens.chunk.overlap=${COURSELENS_CHUNK_OVERLAP:90}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.embedding-dimension=${GEMINI_EMBEDDING_DIMENSION:768}
spring.flyway.enabled=false
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
